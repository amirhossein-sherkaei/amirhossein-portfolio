<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" fill="none">
  <defs>
    <linearGradient id="bg" x1="180" y1="80" x2="1370" y2="1330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35101B"/>
      <stop offset=".48" stop-color="#170B10"/>
      <stop offset="1" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="red" x1="250" y1="200" x2="1260" y2="1220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F04465"/>
      <stop offset=".45" stop-color="#B80F35"/>
      <stop offset="1" stop-color="#570F24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(630 440 -540 774 920 570)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D7193F" stop-opacity=".48"/>
      <stop offset="1" stop-color="#D7193F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="170" y1="0" x2="1420" y2="1250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#FFF" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="54"/>
    </filter>
  </defs>
  <rect width="1600" height="1400" fill="url(#bg)"/>
  <rect width="1600" height="1400" fill="url(#grid)"/>
  <rect width="1600" height="1400" fill="url(#glow)"/>
  <ellipse cx="1040" cy="680" rx="460" ry="390" fill="#D7193F" fill-opacity=".14" filter="url(#blur)"/>

  <!-- Abstract stadium roof and pitch geometry; intentionally not an official club crest. -->
