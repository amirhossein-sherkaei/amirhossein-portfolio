  <text x="140" y="1340" fill="#FFF" fill-opacity=".72" font-family="Arial,sans-serif" font-size="24">A CONCEPT FOR A MORE COHESIVE CLUB EXPERIENCE</text>
  <text x="1460" y="1340" text-anchor="end" fill="#FFF" fill-opacity=".62" font-family="Arial,sans-serif" font-size="22">SHORKAEI.IR</text>
